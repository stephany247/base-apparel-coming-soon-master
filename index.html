<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Subscribe to Base Apparel updates and be the first to know about our launch."
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Base Apparel coming soon page</title>
    <link rel="stylesheet" href="./style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <main class="coming-soon">
      <section class="content">
        <header class="header">
          <a href="/" aria-label="Base Apparel home">
            <img src="./images/logo.svg" alt="Base Apparel" class="logo" />
          </a>
        </header>

        <div class="hero">
          <picture class="hero__image">
            <source
              media="(min-width: 768px)"
              srcset="./images/hero-desktop.jpg"
            />
            <img
              src="./images/hero-mobile.jpg"
              alt="Model wearing a peach-colored shirt"
            />
          </picture>

          <div class="hero__content">
            <h1>
              <span>We're</span>
              Coming Soon
            </h1>

            <p>
              Hello fellow shoppers! We're currently building our new fashion
              store. Add your email below to stay up-to-date with announcements
              and our launch deals.
            </p>

            <form class="email-form" novalidate>
              <label class="sr-only" for="email"> Email address </label>

              <input
                type="email"
                id="email"
                name="email"
                placeholder="Email Address"
                autocomplete="email"
                aria-describedby="email-error"
                required
              />

              <img
                src="./images/icon-error.svg"
                alt=""
                class="email-form__error-icon"
                aria-hidden="true"
              />

              <button type="submit" aria-label="Submit email address">
                <img src="./images/icon-arrow.svg" alt="" aria-hidden="true" />
              </button>

              <p
                class="email-form__error-message"
                id="email-error"
                aria-live="polite"
              ></p>
            </form>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
